<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpaceWx</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#07090f;--panel:#101526;--line:#2a3558;--text:#e8eefc;--muted:#8b97b8;--bad:#f87171;--stale:#f59e0b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.3 Segoe UI,system-ui,sans-serif;overflow:hidden}
a{color:#5eead4}
.app{display:grid;grid-template-rows:118px 1fr;height:100%}
.top{display:grid;grid-template-columns:240px 1fr 170px;gap:8px;padding:8px}
.main{display:grid;grid-template-columns:220px 1fr 280px;min-height:0;height:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.utc{font-size:40px;font-weight:700}.big{font-size:26px;font-weight:700}.muted{color:var(--muted);font-size:12px}.down{color:var(--bad)}
#map{height:100%;background:#0a0e18}.left,.right{padding:8px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.nav a{background:#1a2140;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 8px;text-decoration:none;margin-right:6px}
#tgo{width:100%;background:#fff;border-radius:4px}canvas.na{width:100%;height:220px;display:block;background:#0a0e18}.badge{font-size:11px;color:var(--muted)}
</style></head>
<body>
<div class="app">
<div class="top">
<div class="card"><div class="muted">UTC</div><div class="utc" id="utc">--:--:--</div><div class="muted" id="utcDate"></div></div>
<div class="card"><div class="muted">Kp · SFI · Bz · Dst · Wind</div><div class="big" id="nums">loading</div><div class="badge" id="feedStatus">checking feeds</div></div>
<div class="card"><div class="muted">R / S / G</div><div class="big" id="rsg">—</div></div>
</div>
<div class="main">
<div class="left">
<div class="card"><div class="muted" id="tzLabel">Local</div><div class="big" id="local">--:--</div><div id="placeLabel">Grand Forks, ND</div><div class="muted" id="zipLabel">ZIP 58201</div><div class="muted" id="homeAurora">aurora —</div><div class="nav"><a href="settings.html">Settings</a> <a href="index.html">Live</a></div></div>
<div class="card"><div class="muted">Kp forecast</div><div id="kpForecast">—</div></div>
</div>
<div style="position:relative;min-height:0"><div id="map"></div><div class="muted" id="mapStatus" style="position:absolute;bottom:8px;right:8px;z-index:400;background:#0008;padding:4px 8px;border-radius:6px">map</div></div>
<div class="right">
<div class="card"><div class="muted">Europe H · TGO official</div><img id="tgo" alt="TGO H stackplot" referrerpolicy="no-referrer"><div class="badge" id="tgoStatus">TGO</div></div>
<div class="card"><div class="muted">North America X · USGS</div><canvas class="na" id="naPlot"></canvas><div class="badge" id="naStatus">USGS</div></div>
</div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const FEEDS={kp:["https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json","https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json"],dst:["https://services.swpc.noaa.gov/products/kyoto-dst.json"],sfi:["https://services.swpc.noaa.gov/products/summary/10cm-flux.json"],wind:["https://services.swpc.noaa.gov/products/summary/solar-wind-speed.json"],mag:["https://services.swpc.noaa.gov/products/summary/solar-wind-mag-field.json"],scales:["https://services.swpc.noaa.gov/products/noaa-scales.json"],aurora:["https://services.swpc.noaa.gov/json/ovation_aurora_latest.json"],kpf:["https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json"]};
const TGO="https://flux.phys.uit.no/cgi-bin/mkstackplot.cgi?GifOnly&&comp=H&nor=&Sync=";
const NA=["BRW","CMO","BOU","FRD"];
const DEFAULT={zip:"58201",lat:47.901,lon:-97.0446,place:"Grand Forks, ND",tz:"America/Chicago"};
function loadCfg(){try{return Object.assign({},DEFAULT,JSON.parse(localStorage.getItem("spacewx-cfg")||"{}"));}catch(e){return Object.assign({},DEFAULT)}}
let cfg=loadCfg();
async function grab(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
async function first(list){let err;for(const u of list){try{return{data:await grab(u),src:u.split("/").pop()}}catch(e){err=e}}throw err||new Error("down")}
const last=a=>a&&a[a.length-1];
function mark(el,cls,t){el.className="badge "+(cls||"");el.textContent=t}
const map=L.map("map",{worldCopyJump:true}).setView([cfg.lat,cfg.lon],3);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png",{maxZoom:6}).addTo(map);
let pin=L.circleMarker([cfg.lat,cfg.lon],{radius:7,color:"#fb923c",fillColor:"#fb923c",fillOpacity:1}).addTo(map);
let auroraLayer=null;
function applyPlace(){placeLabel.textContent=cfg.place||"";zipLabel.textContent="ZIP "+(cfg.zip||"—");tzLabel.textContent="Local · "+cfg.tz;if(pin)map.removeLayer(pin);pin=L.circleMarker([cfg.lat,cfg.lon],{radius:7,color:"#fb923c",fillColor:"#fb923c",fillOpacity:1}).addTo(map)}
async function refreshWx(){try{const kp=await first(FEEDS.kp),dst=await first(FEEDS.dst),sfi=await first(FEEDS.sfi),mag=await first(FEEDS.mag),wind=await first(FEEDS.wind),sc=await first(FEEDS.scales);
const k=Number((last(kp.data)||kp.data).Kp);const d=Number((last(dst.data)||{}).dst);const bz=Number((last(mag.data)||mag.data).bz_gsm);const w=Number((last(wind.data)||wind.data).proton_speed);const flux=Number(sfi.data.flux);const n=sc.data["0"]||{};
rsg.textContent=`R${n.R&&n.R.Scale||"—"} / S${n.S&&n.S.Scale||"—"} / G${n.G&&n.G.Scale||"—"}`;
nums.textContent=`Kp ${k.toFixed(1)}   SFI ${Math.round(flux)}   Bz ${bz.toFixed(1)}   Dst ${Math.round(d)}   ${Math.round(w)} km/s`;nums.className="big";mark(feedStatus,"","live");
try{const kf=await first(FEEDS.kpf);const rows=Array.isArray(kf.data)?kf.data.slice(-4):[];kpForecast.textContent=rows.map(r=>`${String(r.time_tag||"").slice(5,13)} ${r.Kp??""}`).join(" · ")||"n/a"}catch(e){kpForecast.textContent="forecast DOWN"}
}catch(e){nums.className="big down";mark(feedStatus,"down","DOWN "+e)}}
async function loadAurora(){try{const o=await first(FEEDS.aurora);const coords=o.data.coordinates||o.data;let best=0;if(auroraLayer)map.removeLayer(auroraLayer);auroraLayer=L.layerGroup();
for(const p of coords){if(!p||p[2]<8)continue;const lon=p[0]>180?p[0]-360:p[0];L.circleMarker([p[1],lon],{radius:4,stroke:false,fillColor:"#22c55e",fillOpacity:0.22,interactive:false}).addTo(auroraLayer);const a=p[1]-cfg.lat,b=lon-cfg.lon;if(a*a+b*b<16)best=Math.max(best,p[2])}
auroraLayer.addTo(map);homeAurora.textContent="aurora "+best+"%";mapStatus.textContent="OVATION live"}catch(e){homeAurora.textContent="aurora DOWN";mapStatus.textContent="aurora DOWN"}}
function loadTgo(){tgo.onload=()=>mark(tgoStatus,"","TGO H · "+new Date().toISOString().slice(11,16)+"Z");tgo.onerror=()=>mark(tgoStatus,"down","TGO DOWN");tgo.src=TGO+"&t="+Date.now()}
async function loadNA(){const c=naPlot,w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2,ctx=c.getContext("2d");ctx.fillStyle="#0a0e18";ctx.fillRect(0,0,w,h);
try{const colors=["#f87171","#60a5fa","#4ade80","#fbbf24"];let i=0;for(const id of NA){const j=await grab("https://geomag.usgs.gov/ws/data/?id="+id+"&format=json");const series=(j.values||[]).find(v=>v.id==="X"||v.id==="H")||j.values&&j.values[0];const vals=(series&&series.values||[]).filter(v=>typeof v==="number");if(vals.length<4)continue;const step=Math.max(1,Math.floor(vals.length/180));const sampled=vals.filter((_,n)=>n%step===0);const min=Math.min(...sampled),max=Math.max(...sampled),span=max-min||1;const y0=20+i*(h-30)/NA.length;ctx.strokeStyle=colors[i%4];ctx.lineWidth=2;ctx.beginPath();sampled.forEach((v,n)=>{const x=n/(sampled.length-1)*w,y=y0-((v-min)/span)*((h-40)/NA.length*0.7);n?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle="#8b97b8";ctx.font="20px sans-serif";ctx.fillText(id,8,y0);i++}mark(naStatus,"","USGS X · "+NA.join(" "))}catch(e){mark(naStatus,"down","USGS DOWN")}}
function tick(){const n=new Date();utc.textContent=n.toISOString().slice(11,19);utcDate.textContent=n.toUTCString().slice(0,16);try{local.textContent=n.toLocaleTimeString("en-US",{timeZone:cfg.tz,hour12:false})}catch(e){local.textContent=n.toISOString().slice(11,19)}}
applyPlace();tick();refreshWx();loadAurora();loadTgo();loadNA();
setInterval(tick,1000);setInterval(refreshWx,60000);setInterval(loadAurora,300000);setInterval(loadTgo,360000);setInterval(loadNA,360000);
</script></body></html>
